# Written once by the docs role of jnterfaces. It is yours from then on.
# After a push to main, publish the docs site to the gh-pages branch. just docs-publish skips a private repository.
# GitHub Pages needs one setting by a person, once: Settings, Pages, the branch gh-pages.
name: Publish the docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Two quick merges publish one after the other, so the later push to gh-pages does not race the first.
concurrency:
  group: docs-publish
  cancel-in-progress: false

jobs:
  publish:
    # A private repository skips the job, and does not install jlog only to skip. just docs-publish checks again.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: extractions/setup-just@v3
      - name: Install jlog, the shell of the recipes
        # The tag v0.4.0 of jlog is the commit 6078806. install.sh comes from the tag. It downloads the release binary,
        # checks its SHA-256 and puts it in ~/.local/bin. The step shell bash has pipefail, so a failed download fails.
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/rahuldave/jlog/v0.4.0/scripts/install.sh | sh -s -- --tag v0.4.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # smalldocs runs rustdoc only for a section api with language: rust in the config of the site. It runs
      # cargo +TOOLCHAIN with the toolchain of that section, nightly by default, not the toolchain file of the project,
      # and with RUSTUP_AUTO_INSTALL=0. So this step installs each such toolchain first. A site with no such section
      # installs nothing. rustdoc builds in a temporary folder, not in target/, so a cache of target/ cannot help it.
      # A config that smalldocs cannot read installs nothing here, and the publish then reports the error.
      # A pre-render script that runs cargo with the toolchain file of the project needs its own install step.
      # The version of smalldocs is the one of the recipes of the role, in .agents/skills/docs/docs.just.
      - name: Install the Rust toolchain of the API pages
        shell: bash
        run: |
          toolchains="$(uvx --quiet --from smalldocs@0.5.13 python -I -c '
          import re
          from smalldocs.config import load
          try:
              conf = load("docs").smalldocs.get("api") or []
          except Exception:
              conf = []
          for section in conf if isinstance(conf, list) else [conf]:
              if isinstance(section, dict) and section.get("language") == "rust":
                  name = section.get("toolchain", "nightly")
                  if isinstance(name, str) and re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]*", name):
                      print(name)
          ')"
          for toolchain in $toolchains; do
            rustup toolchain install --profile minimal "$toolchain"
          done
      - name: Set the git user for the push to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Publish
        run: just docs-publish
