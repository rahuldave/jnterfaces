# Written once by the docs role of jnterfaces. It is yours from then on.
# After a push to main, publish the docs site to the gh-pages branch. just docs-publish skips a private repository.
# GitHub Pages needs one setting by a person, once: Settings, Pages, the branch gh-pages.
name: Publish the docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Two quick merges publish one after the other, so the later push to gh-pages does not race the first.
concurrency:
  group: docs-publish
  cancel-in-progress: false

jobs:
  publish:
    # A private repository skips the job, and does not install jlog only to skip. just docs-publish checks again.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: extractions/setup-just@v3
      - name: Install jlog, the shell of the recipes
        # The tag v0.4.0 of jlog is the commit 6078806. install.sh comes from the tag. It downloads the release binary,
        # checks its SHA-256 and puts it in ~/.local/bin. The step shell bash has pipefail, so a failed download fails.
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/rahuldave/jlog/v0.4.0/scripts/install.sh | sh -s -- --tag v0.4.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # The Rust steps run only in a project with a toolchain file, so the workflow works for any language. rustup
      # reads the file, so the workflow names no channel, and CI runs the compiler of each machine of the project.
      - name: Install the Rust toolchain of rust-toolchain.toml
        id: rust
        if: hashFiles('rust-toolchain.toml', 'rust-toolchain') != ''
        shell: bash
        run: |
          rustup toolchain install
          # The channel of the file, for the key of the cache. rustup reads rust-toolchain first when both are there.
          channel="$(python3 -I -c '
          import pathlib, tomllib
          names = [pathlib.Path(name) for name in ("rust-toolchain", "rust-toolchain.toml")]
          text = next(path for path in names if path.is_file()).read_text()
          try:
              print(tomllib.loads(text)["toolchain"]["channel"])
          except (tomllib.TOMLDecodeError, KeyError, TypeError):
              print(text.strip())
          ')"
          if [[ ! "$channel" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::The toolchain file names no channel that a cache key can hold. Write an exact version, such as channel = \"1.95.0\"."
            exit 1
          fi
          # An exact version, or a nightly or beta of one day, stays the same compiler. Any other channel moves.
          if [[ ! "$channel" =~ ^([0-9]+\.[0-9]+\.[0-9]+|(nightly|beta)-[0-9]{4}-[0-9]{2}-[0-9]{2})$ ]]; then
            echo "::warning::The toolchain file names the channel $channel, which moves. Pin an exact version, such as 1.95.0, so that CI and each machine run the same compiler."
          fi
          echo "toolchain=$channel" >> "$GITHUB_OUTPUT"
      # The cache keeps the crates that cargo downloads and the build folder, target/ with target/llvm-cov-target,
      # when a step of the job runs cargo. A new toolchain or a new Cargo.lock makes a new key. A run reads the
      # caches of its own branch and of the default branch only.
      - name: Restore the Rust cache
        id: rust-cache
        if: steps.rust.outputs.toolchain != ''
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-rust-${{ steps.rust.outputs.toolchain }}-${{ github.job }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-${{ steps.rust.outputs.toolchain }}-${{ github.job }}-
      - name: Set the git user for the push to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Publish
        run: just docs-publish
      # Only a push to main saves the cache, so a manual run on another branch saves none. A key that the restore
      # found exactly is already saved.
      - name: Save the Rust cache
        if: >-
          steps.rust.outputs.toolchain != '' && github.event_name == 'push' && github.ref == 'refs/heads/main'
          && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
