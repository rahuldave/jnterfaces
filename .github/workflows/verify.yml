name: Verify skill package

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      # The whole history and the tags, for just release-check.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # Each tool comes at an exact version, and each download must have the SHA-256 that this file pins. The pins are
      # here, not on the server of the download, so a changed file on that server stops the job. The README of
      # jnterfaces tells how to bump a pin. No action installs a tool, and each action is pinned by the full SHA of its
      # commit, with its version in a note.
      - name: Install the pinned tools
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(uname -s)" != Linux ]; then
            echo "::error::The pinned tools are for Linux, not $(uname -s)."
            exit 1
          fi
          case "$(uname -m)" in
            x86_64 | amd64) target=x86_64-unknown-linux-musl ;;
            aarch64 | arm64) target=aarch64-unknown-linux-musl ;;
            *) echo "::error::No pinned tools for the machine $(uname -m)."; exit 1 ;;
          esac
          # The SHA-256 of each download, as sha256sum prints it, under the name that the step gives the file.
          pins='
          409044617b6f06517c1035e55ca38c8c856ff8b650e41bc2aa1ef82d5903a23e  just-1.59.0-x86_64-unknown-linux-musl.tar.gz
          23871b1702bfd550fb5f901778fd4290ecf2ee034a45a889fbe96d89b188086d  just-1.59.0-aarch64-unknown-linux-musl.tar.gz
          287491da03f2a785c70fa75b13e1f849918c2f2b5415fe84876b8214eeb792f9  uv-0.13.7-x86_64-unknown-linux-musl.tar.gz
          2d3ec076a0c4c0e8250bb6418c44080828b544f1a3be0b6e46adf9fb6923de45  uv-0.13.7-aarch64-unknown-linux-musl.tar.gz
          eb26088362a29ffee930d4ee1b55ff554073442421b0e61b7b60c8ebeed77c81  jlog-v0.5.0-x86_64-unknown-linux-musl.tar.gz
          b22245c51c2fa2175fdefc2f44119b4ee04061548d4903abe17696c18e265716  jlog-v0.5.0-aarch64-unknown-linux-musl.tar.gz
          ce4e8504307e07f980d73064e20d751ebcadf7fd3433c51c97125d4a51dffb93  jlog-v0.5.0-install.sh
          025f117ea8a37fa57d4e17adc2c5220868f840fcf54d2783b1ffc932957a23f6  jagt-v0.6.4-x86_64-unknown-linux-musl.tar.gz
          fcf28faa38c28d794ba23196006cddae26f763b59408f12b3a2b226a102a5fc3  jagt-v0.6.4-aarch64-unknown-linux-musl.tar.gz
          5a601fe074f0f4d81a806ccede005fbf7e24c4287dff45ca1dc1487367d46900  smalldocs-0.5.13-py3-none-any.whl
          '
          work="$(mktemp -d)"
          bin="$HOME/.local/bin"
          mkdir -p "$bin"
          export PATH="$bin:$PATH"
          # fetch NAME URL downloads URL as work/NAME and stops unless its SHA-256 is the pin of NAME.
          fetch() {
            local want got
            want="$(printf '%s\n' "$pins" | awk -v name="$1" '$2 == name { print $1 }')"
            if [[ ! "$want" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::No pinned SHA-256 for $1."
              exit 1
            fi
            curl -fsSL --retry 3 -o "$work/$1" "$2"
            got="$(sha256sum "$work/$1" | awk '{ print $1 }')"
            if [ "$got" != "$want" ]; then
              echo "::error::The SHA-256 of $1 is $got, not the pin $want."
              exit 1
            fi
          }
          fetch "just-1.59.0-$target.tar.gz" "https://github.com/casey/just/releases/download/1.59.0/just-1.59.0-$target.tar.gz"
          tar -xzf "$work/just-1.59.0-$target.tar.gz" -C "$bin" just
          fetch "uv-0.13.7-$target.tar.gz" "https://github.com/astral-sh/uv/releases/download/0.13.7/uv-$target.tar.gz"
          tar -xzf "$work/uv-0.13.7-$target.tar.gz" -C "$bin" --strip-components=1 "uv-$target/uv" "uv-$target/uvx"
          # The install.sh of jlog comes from the commit 224a622 of the tag v0.5.0. It unpacks the pinned archive of jlog,
          # which this step puts in a local release folder, and makes the environments of the plugins with uv.
          fetch "jlog-v0.5.0-$target.tar.gz" "https://github.com/rahuldave/jlog/releases/download/v0.5.0/jlog-$target.tar.gz"
          fetch jlog-v0.5.0-install.sh https://raw.githubusercontent.com/rahuldave/jlog/224a622a27920256e3d6ad6a8363c9ea96078a20/scripts/install.sh
          mkdir -p "$work/release/v0.5.0"
          cp "$work/jlog-v0.5.0-$target.tar.gz" "$work/release/v0.5.0/jlog-$target.tar.gz"
          (cd "$work/release/v0.5.0" && sha256sum "jlog-$target.tar.gz" > "jlog-$target.tar.gz.sha256")
          JLOG_RELEASE_BASE="file://$work/release" sh "$work/jlog-v0.5.0-install.sh" --tag v0.5.0 --dir "$bin"
          fetch "jagt-v0.6.4-$target.tar.gz" "https://github.com/rahuldave/jagt/releases/download/v0.6.4/jagt-$target.tar.gz"
          tar -xzf "$work/jagt-v0.6.4-$target.tar.gz" -C "$bin" jagt
          # uvx smalldocs of the recipes then runs this install of the pinned wheel. uv takes the dependencies of
          # smalldocs from PyPI.
          fetch smalldocs-0.5.13-py3-none-any.whl https://files.pythonhosted.org/packages/py3/s/smalldocs/smalldocs-0.5.13-py3-none-any.whl
          uv tool install --quiet "$work/smalldocs-0.5.13-py3-none-any.whl"
          rm -rf "$work"
          echo "$bin" >> "$GITHUB_PATH"
      - name: Check the release version against the tags and the commits
        run: just release-check
      - name: Check syntax
        run: just lint
      - name: Check the programs that jnterfaces needs, at their version floors
        run: just tools-check
      - name: Get the nossaifd writing checker
        run: |
          git clone --quiet https://github.com/rahuldave/nossaifd "$RUNNER_TEMP/nossaifd"
          git -C "$RUNNER_TEMP/nossaifd" checkout --quiet 92da86a1a7aad5df76f4895c73c8eee4a326c2a3
          echo "NOSSAIFD_CHECK=$RUNNER_TEMP/nossaifd/check.py" >> "$GITHUB_ENV"
      - name: Run the tests
        run: just test
      - name: Validate package manifest with skill-package-maker
        run: just package-lint
      # The step builds the site into a scratch folder with the smalldocs of the job docs, so a broken page fails here.
      - name: Check the docs site
        run: just docs-check

  # On a push to main, after the job verify passed, tag the next release with just release. No agent runs here.
  release:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    # One release at a time. A run on an older commit after a newer release prints no release.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Install the pinned tools
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(uname -s)" != Linux ]; then
            echo "::error::The pinned tools are for Linux, not $(uname -s)."
            exit 1
          fi
          case "$(uname -m)" in
            x86_64 | amd64) target=x86_64-unknown-linux-musl ;;
            aarch64 | arm64) target=aarch64-unknown-linux-musl ;;
            *) echo "::error::No pinned tools for the machine $(uname -m)."; exit 1 ;;
          esac
          # The SHA-256 of each download, as sha256sum prints it, under the name that the step gives the file.
          pins='
          409044617b6f06517c1035e55ca38c8c856ff8b650e41bc2aa1ef82d5903a23e  just-1.59.0-x86_64-unknown-linux-musl.tar.gz
          23871b1702bfd550fb5f901778fd4290ecf2ee034a45a889fbe96d89b188086d  just-1.59.0-aarch64-unknown-linux-musl.tar.gz
          287491da03f2a785c70fa75b13e1f849918c2f2b5415fe84876b8214eeb792f9  uv-0.13.7-x86_64-unknown-linux-musl.tar.gz
          2d3ec076a0c4c0e8250bb6418c44080828b544f1a3be0b6e46adf9fb6923de45  uv-0.13.7-aarch64-unknown-linux-musl.tar.gz
          '
          work="$(mktemp -d)"
          bin="$HOME/.local/bin"
          mkdir -p "$bin"
          export PATH="$bin:$PATH"
          # fetch NAME URL downloads URL as work/NAME and stops unless its SHA-256 is the pin of NAME.
          fetch() {
            local want got
            want="$(printf '%s\n' "$pins" | awk -v name="$1" '$2 == name { print $1 }')"
            if [[ ! "$want" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::No pinned SHA-256 for $1."
              exit 1
            fi
            curl -fsSL --retry 3 -o "$work/$1" "$2"
            got="$(sha256sum "$work/$1" | awk '{ print $1 }')"
            if [ "$got" != "$want" ]; then
              echo "::error::The SHA-256 of $1 is $got, not the pin $want."
              exit 1
            fi
          }
          fetch "just-1.59.0-$target.tar.gz" "https://github.com/casey/just/releases/download/1.59.0/just-1.59.0-$target.tar.gz"
          tar -xzf "$work/just-1.59.0-$target.tar.gz" -C "$bin" just
          fetch "uv-0.13.7-$target.tar.gz" "https://github.com/astral-sh/uv/releases/download/0.13.7/uv-$target.tar.gz"
          tar -xzf "$work/uv-0.13.7-$target.tar.gz" -C "$bin" --strip-components=1 "uv-$target/uv" "uv-$target/uvx"
          rm -rf "$work"
          echo "$bin" >> "$GITHUB_PATH"
      - name: Name the author of the tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Tag the release
        run: just release

  # On a push to main, after the job verify passed, build the site and push it to gh-pages, which GitHub Pages serves.
  # The sitemap dates each page by the time of its file, which a fresh checkout sets, so most runs commit to gh-pages.
  # No agent runs here.
  docs:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    # One publish at a time. A newer run cancels an older publish, waiting or running, and publishes the tip of main
    # itself. A push of git is atomic, so a cancelled publish leaves gh-pages as it was.
    concurrency:
      group: docs
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install the pinned tools
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(uname -s)" != Linux ]; then
            echo "::error::The pinned tools are for Linux, not $(uname -s)."
            exit 1
          fi
          case "$(uname -m)" in
            x86_64 | amd64) target=x86_64-unknown-linux-musl ;;
            aarch64 | arm64) target=aarch64-unknown-linux-musl ;;
            *) echo "::error::No pinned tools for the machine $(uname -m)."; exit 1 ;;
          esac
          # The SHA-256 of each download, as sha256sum prints it, under the name that the step gives the file.
          pins='
          409044617b6f06517c1035e55ca38c8c856ff8b650e41bc2aa1ef82d5903a23e  just-1.59.0-x86_64-unknown-linux-musl.tar.gz
          23871b1702bfd550fb5f901778fd4290ecf2ee034a45a889fbe96d89b188086d  just-1.59.0-aarch64-unknown-linux-musl.tar.gz
          287491da03f2a785c70fa75b13e1f849918c2f2b5415fe84876b8214eeb792f9  uv-0.13.7-x86_64-unknown-linux-musl.tar.gz
          2d3ec076a0c4c0e8250bb6418c44080828b544f1a3be0b6e46adf9fb6923de45  uv-0.13.7-aarch64-unknown-linux-musl.tar.gz
          5a601fe074f0f4d81a806ccede005fbf7e24c4287dff45ca1dc1487367d46900  smalldocs-0.5.13-py3-none-any.whl
          '
          work="$(mktemp -d)"
          bin="$HOME/.local/bin"
          mkdir -p "$bin"
          export PATH="$bin:$PATH"
          # fetch NAME URL downloads URL as work/NAME and stops unless its SHA-256 is the pin of NAME.
          fetch() {
            local want got
            want="$(printf '%s\n' "$pins" | awk -v name="$1" '$2 == name { print $1 }')"
            if [[ ! "$want" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::No pinned SHA-256 for $1."
              exit 1
            fi
            curl -fsSL --retry 3 -o "$work/$1" "$2"
            got="$(sha256sum "$work/$1" | awk '{ print $1 }')"
            if [ "$got" != "$want" ]; then
              echo "::error::The SHA-256 of $1 is $got, not the pin $want."
              exit 1
            fi
          }
          fetch "just-1.59.0-$target.tar.gz" "https://github.com/casey/just/releases/download/1.59.0/just-1.59.0-$target.tar.gz"
          tar -xzf "$work/just-1.59.0-$target.tar.gz" -C "$bin" just
          fetch "uv-0.13.7-$target.tar.gz" "https://github.com/astral-sh/uv/releases/download/0.13.7/uv-$target.tar.gz"
          tar -xzf "$work/uv-0.13.7-$target.tar.gz" -C "$bin" --strip-components=1 "uv-$target/uv" "uv-$target/uvx"
          # uvx smalldocs of the recipes then runs this install of the pinned wheel. uv takes the dependencies of
          # smalldocs from PyPI.
          fetch smalldocs-0.5.13-py3-none-any.whl https://files.pythonhosted.org/packages/py3/s/smalldocs/smalldocs-0.5.13-py3-none-any.whl
          uv tool install --quiet "$work/smalldocs-0.5.13-py3-none-any.whl"
          rm -rf "$work"
          echo "$bin" >> "$GITHUB_PATH"
      - name: Name the author of the commit of gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Publish the site of the tip of main
        # The verify of an older push can end after that of a newer one, and a newer run can cancel an older one. So
        # each run publishes the tip of main, not its own commit, and the run that ends last publishes the newest site.
        shell: bash
        run: |
          git fetch --quiet origin main
          git checkout --quiet --detach FETCH_HEAD
          echo "publishing the site of main at $(git rev-parse HEAD)"
          just docs-publish
