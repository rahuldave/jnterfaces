name: Verify skill package

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # The whole history and the tags, for just release-check.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: extractions/setup-just@v3
      - name: Check the release version against the tags and the commits
        run: just release-check
      - name: Check syntax
        run: just lint
      # Each install.sh downloads a release binary and checks its SHA-256. It puts the binary in ~/.local/bin.
      # The step shell bash has pipefail, so a failed download of install.sh fails the step.
      - name: Install jlog, the shell of the recipes that the installer writes
        # The tag v0.4.0 of jlog is the commit 6078806. install.sh comes from the tag. The installer runs the checks
        # of the programs through its jlog run. setup-uv comes first, so install.sh makes the environments of the plugins.
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/rahuldave/jlog/v0.4.0/scripts/install.sh | sh -s -- --tag v0.4.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install jagt for the protocol demo test
        # install.sh comes from the tag v0.6.4 of jagt.
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/rahuldave/jagt/v0.6.4/scripts/install.sh | sh -s -- --tag v0.6.4
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Check the programs that jnterfaces needs, at their version floors
        run: just tools-check
      - name: Get the nossaifd writing checker
        run: |
          git clone --quiet https://github.com/rahuldave/nossaifd "$RUNNER_TEMP/nossaifd"
          git -C "$RUNNER_TEMP/nossaifd" checkout --quiet 92da86a1a7aad5df76f4895c73c8eee4a326c2a3
          echo "NOSSAIFD_CHECK=$RUNNER_TEMP/nossaifd/check.py" >> "$GITHUB_ENV"
      - name: Run the tests
        run: just test
      - name: Validate package manifest with skill-package-maker
        run: just package-lint

  # On a push to main, after the job verify passed, tag the next release with just release. No agent runs here.
  release:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    # One release at a time. A run on an older commit after a newer release prints no release.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: extractions/setup-just@v3
      - name: Name the author of the tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Tag the release
        run: just release

  # On a push to main, after the job verify passed, build the site and push it to gh-pages, which GitHub Pages serves.
  # The sitemap dates each page by the time of its file, which a fresh checkout sets, so most runs commit to gh-pages.
  # No agent runs here.
  docs:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    # One publish at a time. A newer run cancels an older publish, waiting or running, and publishes the tip of main
    # itself. A push of git is atomic, so a cancelled publish leaves gh-pages as it was.
    concurrency:
      group: docs
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: extractions/setup-just@v3
      - name: Name the author of the commit of gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Publish the site of the tip of main
        # The verify of an older push can end after that of a newer one, and a newer run can cancel an older one. So
        # each run publishes the tip of main, not its own commit, and the run that ends last publishes the newest site.
        shell: bash
        run: |
          git fetch --quiet origin main
          git checkout --quiet --detach FETCH_HEAD
          echo "publishing the site of main at $(git rev-parse HEAD)"
          just docs-publish
