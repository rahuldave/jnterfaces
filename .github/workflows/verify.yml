name: Verify skill package

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # The whole history and the tags, for just release-check.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: extractions/setup-just@v3
      - name: Check the release version against the tags and the commits
        run: just release-check
      - name: Check syntax
        run: just lint
      - name: Build jlog, the shell of the recipes that the installer writes
        # The tag v0.2.0 of jlog is the commit 8febdf1. The installer runs the checks of the programs through its jlog run.
        run: cargo install --locked --git https://github.com/rahuldave/jlog --tag v0.2.0 jlog
      - name: Build jagt for the protocol demo test
        run: cargo install --locked --git https://github.com/rahuldave/jagt jagt
      - name: Check the programs that jnterfaces needs, at their version floors
        run: just tools-check
      - name: Get the nossaifd writing checker
        run: |
          git clone --quiet https://github.com/rahuldave/nossaifd "$RUNNER_TEMP/nossaifd"
          git -C "$RUNNER_TEMP/nossaifd" checkout --quiet 92da86a1a7aad5df76f4895c73c8eee4a326c2a3
          echo "NOSSAIFD_CHECK=$RUNNER_TEMP/nossaifd/check.py" >> "$GITHUB_ENV"
      - name: Run the tests
        run: just test
      - name: Validate package manifest with skill-package-maker
        run: just package-lint

  # On a push to main, after the job verify passed, tag the next release with just release. No agent runs here.
  release:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    # One release at a time. A run on an older commit after a newer release prints no release.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: extractions/setup-just@v3
      - name: Name the author of the tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Tag the release
        run: just release
