# The checks that run before every commit. `just hook` installs them as a git hook.
# Run them on every file: uv run pre-commit run --all-files
repos:
  # Checks of any file
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key

  # ruff, with the settings in ruff.toml or pyproject.toml: the linter, then the formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
      - id: ruff-format
