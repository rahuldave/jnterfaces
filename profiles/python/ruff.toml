# ruff settings from the python profile of jnterfaces. The file is yours: change it as the project needs.
# The longest line, for the formatter and the linter
line-length = 120
# The folders that the installer manages hold copies from other packages, not the code of this project
extend-exclude = [".agents", ".claude", ".codex"]

[lint]
# The rules that flake8 checks: pycodestyle's errors (E) and warnings (W), and pyflakes (F)
select = ["E", "W", "F"]
